services:
  pia-wg-daemon:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - PIA_USERNAME=${PIA_USERNAME}
      - PIA_PASSWORD=${PIA_PASSWORD}
      - CURL_PATH=${CURL_PATH}
      - TZ=${TZ}
    entrypoint: ["/bin/sh","-lc"]
    command: >
      'ARGS="daemon --verbose --state-dir=${STATE_DIR} --region=${PIA_REGION} --refresh-interval=30m --refresh-jitter=2m";
      if [ "${PIA_PF}" = "1" ]; then ARGS="$ARGS --port-forwarding"; fi;
      if [ -n "${IPV6_MODE}" ]; then ARGS="$ARGS --ipv6-mode=${IPV6_MODE}"; fi;
      exec pia-wg-config $ARGS'
    volumes:
      - state:/gluetun
    healthcheck:
      test: ["CMD-SHELL", "test -s ${STATE_DIR}/wg0.conf"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s
    restart: "no"

  gluetun:
    image: qmcgaw/gluetun:latest
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pia-wg-daemon:
        condition: service_healthy
    volumes:
      - state:/gluetun:rw
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - UPDATER_PERIOD=0
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- ${IP_CHECK_URL} >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  tester:
    build:
      context: ../common/tester
      dockerfile: Dockerfile
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - STATE_DIR=${STATE_DIR}
      - WG_CONF_NAME=${WG_CONF_NAME}
      - PF_PORT_FILE=${PF_PORT_FILE}
      - IP_CHECK_URL=${IP_CHECK_URL}
      - PIA_PF=${PIA_PF}
    volumes:
      - state:/gluetun:ro
    restart: "no"

volumes:
  state:
