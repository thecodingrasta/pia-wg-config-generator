services:
  pia-wg-seed:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      - PIA_USERNAME=${PIA_USERNAME}
      - PIA_PASSWORD=${PIA_PASSWORD}
      - PIA_REGION=${PIA_REGION}
      - PIA_PF=${PIA_PF}
      - IPV6_MODE=${IPV6_MODE}
      - STATE_DIR=${STATE_DIR}
      - CURL_PATH=${CURL_PATH}
      - TZ=${TZ}
    entrypoint: ["/bin/sh","-lc"]
    command: >
      'set -- generate --verbose --region="${PIA_REGION}" --outfile="${STATE_DIR}/wg0.conf";
      if [ "${PIA_PF}" = "1" ]; then set -- "$@" --port-forwarding; fi;
      if [ -n "${IPV6_MODE}" ]; then set -- "$@" --ipv6-mode="${IPV6_MODE}"; fi;
      pia-wg-config "$@";
      tail -f /dev/null'
    volumes:
      - state:/gluetun
    healthcheck:
      test: ["CMD-SHELL", "test -s ${STATE_DIR}/wg0.conf"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s
    restart: "no"

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: pia-wg-system-gluetun
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pia-wg-seed:
        condition: service_healthy
    volumes:
      - state:/gluetun:rw
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - UPDATER_PERIOD=0
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- ${IP_CHECK_URL} >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  pia-wg-daemon:
    build:
      context: ../..
      dockerfile: Dockerfile
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PIA_USERNAME=${PIA_USERNAME}
      - PIA_PASSWORD=${PIA_PASSWORD}
      - PIA_REGION=${PIA_REGION}
      - PIA_PF=${PIA_PF}
      - IPV6_MODE=${IPV6_MODE}
      - STATE_DIR=${STATE_DIR}
      - CURL_PATH=${CURL_PATH}
      - TZ=${TZ}
    entrypoint: ["/bin/sh","-lc"]
    command: >
      'set -- daemon --verbose --state-dir="${STATE_DIR}" --region="${PIA_REGION}" --refresh-interval=30m --refresh-jitter=2m --retry-delay=30s --restart-container=pia-wg-system-gluetun;
      if [ "${PIA_PF}" = "1" ]; then set -- "$@" --port-forwarding; fi;
      if [ -n "${IPV6_MODE}" ]; then set -- "$@" --ipv6-mode="${IPV6_MODE}"; fi;
      exec pia-wg-config "$@"'
    volumes:
      - state:/gluetun
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "test \"${PIA_PF}\" != \"1\" -o -s ${STATE_DIR}/${PF_PORT_FILE}"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s
    restart: unless-stopped

  tester:
    build:
      context: ..
      dockerfile: common/tester/Dockerfile
    depends_on:
      pia-wg-daemon:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - STATE_DIR=${STATE_DIR}
      - WG_CONF_NAME=${WG_CONF_NAME}
      - PF_PORT_FILE=${PF_PORT_FILE}
      - IP_CHECK_URL=${IP_CHECK_URL}
      - PIA_PF=${PIA_PF}
    volumes:
      - state:/gluetun:ro
    restart: "no"

volumes:
  state:
