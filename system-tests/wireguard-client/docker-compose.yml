services:
  pia-wg-daemon:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      - PIA_USERNAME=${PIA_USERNAME}
      - PIA_PASSWORD=${PIA_PASSWORD}
      - PIA_REGION=${PIA_REGION}
      - PIA_PF=${PIA_PF}
      - IPV6_MODE=${IPV6_MODE}
      - STATE_DIR=${STATE_DIR}
      - CURL_PATH=${CURL_PATH}
      - TZ=${TZ}
    entrypoint: ["/bin/sh","-lc"]
    command: >
      'set -- daemon --verbose --state-dir="${STATE_DIR}" --region="${PIA_REGION}" --refresh-interval=30m --refresh-jitter=2m;
      if [ "${PIA_PF}" = "1" ]; then set -- "$@" --port-forwarding; fi;
      if [ -n "${IPV6_MODE}" ]; then set -- "$@" --ipv6-mode="${IPV6_MODE}"; fi;
      exec pia-wg-config "$@"'
    volumes:
      - state:${STATE_DIR}
    healthcheck:
      test: ["CMD-SHELL", "test -s ${STATE_DIR}/${WG_CONF_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s
    restart: "no"

  wgclient:
    image: linuxserver/wireguard:latest
    cap_add: [NET_ADMIN, SYS_MODULE]
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      pia-wg-daemon:
        condition: service_healthy
    volumes:
      - state:${STATE_DIR}:ro
      # linuxserver/wireguard expects /config/wg0.conf
      - state:/config:rw
    environment:
      - TZ=${TZ}
    restart: "no"
    # Ensure wg0.conf is present in /config
    entrypoint: ["/bin/sh","-lc"]
    command: >
      'cp ${STATE_DIR}/${WG_CONF_NAME} /config/wg0.conf &&
       chmod 600 /config/wg0.conf &&
       /init'

  tester:
    build:
      context: ..
      dockerfile: common/tester/Dockerfile
    depends_on:
      - wgclient
    network_mode: "service:wgclient"
    environment:
      - STATE_DIR=${STATE_DIR}
      - WG_CONF_NAME=${WG_CONF_NAME}
      - PF_PORT_FILE=${PF_PORT_FILE}
      - IP_CHECK_URL=${IP_CHECK_URL}
      - PIA_PF=${PIA_PF}
    volumes:
      - state:${STATE_DIR}:ro
    restart: "no"

volumes:
  state:
