services:
  pia-wg-daemon:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      - PIA_USERNAME=${PIA_USERNAME}
      - PIA_PASSWORD=${PIA_PASSWORD}
      - CURL_PATH=${CURL_PATH}
      - TZ=${TZ}
    entrypoint: ["/bin/sh","-lc"]
    command: >
      'ARGS="daemon --verbose --state-dir=${STATE_DIR} --region=${PIA_REGION} --refresh-interval=30m --refresh-jitter=2m";
      if [ "${PIA_PF}" = "1" ]; then ARGS="$ARGS --port-forwarding"; fi;
      if [ -n "${IPV6_MODE}" ]; then ARGS="$ARGS --ipv6=${IPV6_MODE}"; fi;
      exec pia-wg-config $ARGS'
    volumes:
      - state:${STATE_DIR}
    restart: "no"

  wgclient:
    image: linuxserver/wireguard:latest
    cap_add: [NET_ADMIN, SYS_MODULE]
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      - pia-wg-daemon
    volumes:
      - state:${STATE_DIR}:ro
      # linuxserver/wireguard expects /config/wg0.conf
      - state:/config:rw
    environment:
      - TZ=${TZ}
    restart: "no"
    # Ensure wg0.conf is present in /config
    entrypoint: ["/bin/sh","-lc"]
    command: >
      'cp ${STATE_DIR}/${WG_CONF_NAME} /config/wg0.conf &&
       chmod 600 /config/wg0.conf &&
       /init'

  tester:
    build:
      context: ../common/tester
      dockerfile: Dockerfile
    depends_on:
      - wgclient
    network_mode: "service:wgclient"
    environment:
      - STATE_DIR=${STATE_DIR}
      - WG_CONF_NAME=${WG_CONF_NAME}
      - PF_PORT_FILE=${PF_PORT_FILE}
      - IP_CHECK_URL=${IP_CHECK_URL}
      - PIA_PF=${PIA_PF}
    volumes:
      - state:${STATE_DIR}:ro
    restart: "no"

volumes:
  state: