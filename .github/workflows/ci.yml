name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Cancel in-flight runs for the same ref so stale runs don't consume quota.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Unit tests — runs on all three platforms
  # ─────────────────────────────────────────────────────────────────────────
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test -mod=vendor ./...

  # ─────────────────────────────────────────────────────────────────────────
  # Race detector — Linux only (requires CGO / gcc)
  # ─────────────────────────────────────────────────────────────────────────
  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Unit tests (race)
        run: go test -race -mod=vendor ./...

  # ─────────────────────────────────────────────────────────────────────────
  # Build check — verify the binary compiles on all platforms
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build binary
        run: go build -mod=vendor -o pia-wg-config${{ matrix.os == 'windows-latest' && '.exe' || '' }} .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pia-wg-config-${{ matrix.os }}
          path: pia-wg-config${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Integration tests — real PIA API; secrets-gated, Linux only
  # ─────────────────────────────────────────────────────────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Only run when secrets are available (skipped on forks / unsigned PRs)
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    env:
      PIA_USERNAME: ${{ secrets.PIA_USERNAME }}
      PIA_PASSWORD: ${{ secrets.PIA_PASSWORD }}
      PIA_REGION:   ${{ secrets.PIA_REGION || 'uk_southampton' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Integration tests
        # go test skips gracefully if PIA_USERNAME/PIA_PASSWORD are unset
        run: go test -mod=vendor -tags=integration -v ./pia/...

  # ─────────────────────────────────────────────────────────────────────────
  # Docker smoke tests — public-CI safe, no PIA credentials required
  # ─────────────────────────────────────────────────────────────────────────
  system-gluetun:
    name: Docker smoke — Gluetun
    runs-on: ubuntu-latest
    needs: [unit, build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Gluetun Docker smoke test
        run: bash system-tests/ci-smoke.sh gluetun

  system-gluetun-pf:
    name: Docker smoke — Gluetun + Port Forwarding
    runs-on: ubuntu-latest
    needs: [unit, build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Gluetun + PF Docker smoke test
        run: bash system-tests/ci-smoke.sh gluetun --pf

  system-wg-client:
    name: Docker smoke — WireGuard client
    runs-on: ubuntu-latest
    needs: [unit, build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run WireGuard client Docker smoke test
        run: bash system-tests/ci-smoke.sh wireguard-client
