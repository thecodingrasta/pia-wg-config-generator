name: Publish container image

# Pushes the multi-architecture image to GHCR when a maintainer PUBLISHES a
# release (the draft that release.yml created). Nothing reaches the registry
# until a human has reviewed and published the release.
#
# A pre-release (a tag with a hyphen, such as v1.2.0-rc.1) gets only its exact
# version tag. A final release also moves the {major}.{minor}, {major} and
# `latest` tags.
#
# To retry a failed push without republishing the release, run this workflow
# manually and enter the same tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing published version tag to (re)publish, such as v1.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # keyless signing for provenance
      attestations: write  # store the provenance attestation
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Validate the version tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a strict semantic version tag such as v1.2.0 or v1.2.0-rc.1."
            exit 1
          fi

      # Build the tagged commit, whichever ref this run was started from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.VERSION }}
          persist-credentials: false

      - id: commit
        name: Resolve commit and timestamp
        shell: bash
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "date=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ !contains(env.VERSION, '-') }}
            type=semver,pattern={{major}},value=${{ env.VERSION }},enable=${{ !contains(env.VERSION, '-') }}
            type=raw,value=latest,enable=${{ !contains(env.VERSION, '-') }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ steps.commit.outputs.sha }}
            BUILD_DATE=${{ steps.commit.outputs.date }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Prove what was pushed: pull the image by digest and run it.
      - name: Verify the pushed image reports its version
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          out="$(docker run --rm "$IMAGE" --version)"
          echo "$out"
          case "$out" in
            *"$VERSION"*) ;;
            *) echo "::error::The pushed image does not report $VERSION."; exit 1 ;;
          esac
