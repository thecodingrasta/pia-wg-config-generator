name: Draft release

# Drafts a GitHub Release from an EXISTING, reviewed version tag. It never
# publishes anything: a maintainer reviews the draft and presses Publish, and
# publishing is what triggers publish-image.yml to push the container image.
#
# How to cut a release (also in CONTRIBUTING.md):
#   1. Merge everything for the release into main and wait for CI to pass.
#   2. Tag that exact commit and push the tag:
#        git tag -a v1.2.0 -m "v1.2.0" && git push origin v1.2.0
#   3. Actions > Draft release > Run workflow. Choose the tag in "Use workflow
#      from" (or main, if it is still at the tagged commit) and enter the same
#      version. Use a pre-release tag such as v1.2.0-rc.1 to rehearse.
#   4. Review the draft, then Publish.
#
# Assets (exactly these, plus SHA256SUMS):
#   pia-wg-config             Linux   amd64
#   pia-wg-config.exe         Windows amd64
#   pia-wg-config-arm64.exe   Windows arm64
#
# The pipeline is gated end to end: the full CI suite must pass, the packaged
# binaries are checksummed, and each one is executed on a native runner of its
# own platform before a draft is created.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing reviewed version tag, such as v1.2.0 or v1.2.0-rc.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Releases are only ever cut from commits that are on the default branch.
  RELEASE_BRANCH: main

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Gate: the same suite that guards every push, including vulnerability scan,
  # lint, module hygiene, the cross-platform tests and the Docker smoke tests.
  # ─────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  # ─────────────────────────────────────────────────────────────────────────
  # Build the three release binaries from the tagged commit. Static (CGO off),
  # trimmed, stripped, and stamped with the tag so `--version` reports exactly
  # what was shipped.
  # ─────────────────────────────────────────────────────────────────────────
  package:
    name: Package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # never restore a build cache into a release artefact
          # The binaries embed the standard library of the toolchain that builds
          # them, so ship the newest patch (it carries the stdlib security fixes).
          check-latest: true

      - name: Verify the tag, then build and checksum
        env:
          VERSION: ${{ inputs.version }}
          GOTOOLCHAIN: local
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a strict semantic version tag such as v1.2.0 or v1.2.0-rc.1."
            exit 1
          fi

          tag_commit="$(git rev-parse --verify --end-of-options "refs/tags/${VERSION}^{commit}" 2>/dev/null || true)"
          if [[ -z "$tag_commit" ]]; then
            echo "::error::Tag $VERSION does not exist. Create and push it first."
            exit 1
          fi
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $VERSION points at $tag_commit but this run is on $GITHUB_SHA. Choose the tag (or a ref at the same commit) in 'Use workflow from'."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" "origin/${RELEASE_BRANCH}"; then
            echo "::error::$VERSION ($tag_commit) is not reachable from ${RELEASE_BRANCH}. Merge to ${RELEASE_BRANCH} first, then tag that commit."
            exit 1
          fi

          commit_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=${commit_date}"

          mkdir -p release
          build() { # <goos> <goarch> <output name>
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" \
              go build -mod=vendor -trimpath -ldflags "$ldflags" -o "release/$3" .
          }
          build linux   amd64 pia-wg-config
          build windows amd64 pia-wg-config.exe
          build windows arm64 pia-wg-config-arm64.exe

          (cd release && sha256sum pia-wg-config pia-wg-config.exe pia-wg-config-arm64.exe > SHA256SUMS && sha256sum -c SHA256SUMS)
          ls -l release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-downloads
          path: |
            release/pia-wg-config
            release/pia-wg-config.exe
            release/pia-wg-config-arm64.exe
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # Run each downloaded binary on a native runner of its own platform, after
  # re-verifying its checksum. A cross-compiled binary that does not start is
  # caught here, before anything is drafted.
  # ─────────────────────────────────────────────────────────────────────────
  smoke:
    name: Smoke (${{ matrix.asset }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,  asset: pia-wg-config }
          - { runner: windows-latest, asset: pia-wg-config.exe }
          - { runner: windows-11-arm, asset: pia-wg-config-arm64.exe }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-downloads
          path: downloads

      - name: Verify and exercise the downloaded native executable
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          ASSET: ${{ matrix.asset }}
        run: |
          $ErrorActionPreference = 'Stop'

          $directory = (Resolve-Path -LiteralPath 'downloads').Path
          $binary = Join-Path $directory $env:ASSET

          # Checksum first: the binary must be byte-identical to what was packaged.
          $pattern = '^[0-9a-f]{64}\s+\*?' + [regex]::Escape($env:ASSET) + '$'
          $entry = @(Get-Content -LiteralPath (Join-Path $directory 'SHA256SUMS') | Where-Object { $_ -match $pattern })
          if ($entry.Count -ne 1) { throw "Expected exactly one SHA256SUMS entry for $($env:ASSET), found $($entry.Count)" }
          $expected = ($entry[0] -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Checksum mismatch for $($env:ASSET): expected $expected, got $actual" }

          if (-not $IsWindows) {
            chmod +x $binary
            if ($LASTEXITCODE -ne 0) { throw 'chmod failed' }
          }

          # The binary must report the tag it was built for.
          $output = (& $binary --version) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }
          Write-Host $output
          if (-not $output.Contains($env:VERSION)) { throw "--version does not contain $($env:VERSION)" }

          # Every command a user relies on must be registered in the release build.
          foreach ($command in @('--help'), @('generate', '--help'), @('regions', '--help'), @('daemon', '--help'),
                                 @('refresh', '--help'), @('pf', '--help'), @('healthcheck', '--help')) {
            & $binary @command | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "'$($command -join ' ')' exited $LASTEXITCODE" }
          }

          # The container healthcheck must fail closed when there is no state.
          $empty = Join-Path ([IO.Path]::GetTempPath()) ([Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $empty | Out-Null
          & $binary healthcheck --state-dir $empty | Out-Null
          if ($LASTEXITCODE -ne 1) { throw "healthcheck on an empty state directory exited $LASTEXITCODE, want 1" }

  # ─────────────────────────────────────────────────────────────────────────
  # Create the draft. Never published automatically.
  # ─────────────────────────────────────────────────────────────────────────
  draft:
    name: Draft GitHub release
    needs: [package, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create the draft release and upload assets
      id-token: write      # keyless signing for provenance
      attestations: write  # store the provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-downloads
          path: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/pia-wg-config
            release/pia-wg-config.exe
            release/pia-wg-config-arm64.exe

      - name: Create a draft, never publish automatically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a strict semantic version tag."
            exit 1
          fi

          # Refuse to touch an existing release or draft for this tag; delete a
          # stale draft in the UI first. `gh release list` includes drafts.
          existing="$(gh release list --limit 200 --json tagName | jq --arg v "$VERSION" '[.[] | select(.tagName == $v)] | length')"
          if [[ "$existing" != "0" ]]; then
            echo "::error::A release or draft for $VERSION already exists. Delete the stale draft, then run this workflow again."
            exit 1
          fi

          flags=(--verify-tag --draft --generate-notes --title "$VERSION")
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi

          gh release create "$VERSION" \
            release/pia-wg-config release/pia-wg-config.exe release/pia-wg-config-arm64.exe release/SHA256SUMS \
            "${flags[@]}"

          {
            echo "### Draft release created: $VERSION"
            echo
            echo "Review it under Releases, then press **Publish**. Publishing triggers the"
            echo "**Publish container image** workflow, which pushes \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION#v}\`."
          } >> "$GITHUB_STEP_SUMMARY"
